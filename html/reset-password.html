<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Unity Hostel</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div id="toastContainer"></div>

  <main class="auth-wrapper">
    <a href="index.html" class="brand auth-brand">
      <div class="brand-mark">U</div>
      <span class="brand-text">Unity Hostel</span>
    </a>

    <div class="auth-card-3d">
      <div class="auth-header">
        <span class="eyebrow">Account Recovery</span>
        <h1>Reset Password</h1>
        <p>Enter the 6-digit reset code from your email and set your new password.</p>
      </div>

      <div id="alertBox" class="alert-box error" style="display: none;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="alertMessage">Please check your inputs</span>
      </div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="resetEmail">Email Address</label>
          <input 
            type="email" 
            id="resetEmail" 
            name="email" 
            class="form-input" 
            placeholder="resident@example.com" 
            autocomplete="email" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label">6-Digit Reset Code</label>
          <div class="otp-container" id="resetOtpBoxContainer">
            <input type="text" maxlength="1" class="otp-box reset-otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus data-index="0" required>
            <input type="text" maxlength="1" class="otp-box reset-otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="1" required>
            <input type="text" maxlength="1" class="otp-box reset-otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="2" required>
            <input type="text" maxlength="1" class="otp-box reset-otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="3" required>
            <input type="text" maxlength="1" class="otp-box reset-otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="4" required>
            <input type="text" maxlength="1" class="otp-box reset-otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="5" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="resetNewPassword">New Password</label>
          <div class="password-wrap">
            <input 
              type="password" 
              id="resetNewPassword" 
              name="password" 
              class="form-input" 
              placeholder="Minimum 8 characters" 
              autocomplete="new-password" 
              required
            >
            <button type="button" class="password-toggle" data-target="resetNewPassword" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="strength-bar-wrap">
            <div class="strength-bar">
              <div class="strength-segment" id="strSeg1"></div>
              <div class="strength-segment" id="strSeg2"></div>
              <div class="strength-segment" id="strSeg3"></div>
              <div class="strength-segment" id="strSeg4"></div>
            </div>
            <div class="strength-label">
              <span id="strengthText">Password strength: Weak</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="resetConfirmPassword">Confirm New Password</label>
          <div class="password-wrap">
            <input 
              type="password" 
              id="resetConfirmPassword" 
              name="confirmPassword" 
              class="form-input" 
              placeholder="Re-enter new password" 
              autocomplete="new-password" 
              required
            >
            <button type="button" class="password-toggle" data-target="resetConfirmPassword" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="resetBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 24px;">
          <span class="btn-text">Reset Password</span>
          <span class="spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        Back to <a href="login.html">Sign In</a>
      </div>
    </div>

    <a href="index.html" class="back-to-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Homepage
    </a>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
