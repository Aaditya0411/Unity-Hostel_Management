<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Unity Hostel</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div id="toastContainer"></div>

  <main class="auth-wrapper">
    <a href="index.html" class="brand auth-brand">
      <div class="brand-mark">U</div>
      <span class="brand-text">Unity Hostel</span>
    </a>

    <div class="auth-card-3d">
      <div class="auth-header">
        <span class="eyebrow">Account Recovery</span>
        <h1>Forgot Password?</h1>
        <p>Enter your registered email and we'll dispatch a 6-digit recovery code.</p>
      </div>

      <div id="alertBox" class="alert-box error" style="display: none;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="alertMessage">Please enter your email</span>
      </div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Email Address</label>
          <input 
            type="email" 
            id="forgotEmail" 
            name="email" 
            class="form-input" 
            placeholder="resident@example.com" 
            autocomplete="email" 
            required
          >
        </div>

        <button type="submit" id="forgotBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 24px;">
          <span class="btn-text">Send Reset Code</span>
          <span class="spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="login.html">Back to Sign In</a>
      </div>
    </div>

    <a href="index.html" class="back-to-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Homepage
    </a>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
